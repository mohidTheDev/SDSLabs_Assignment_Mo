<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <title>
        Drawing App
    </title>
</head>

<body>
    <div class="app-wrapper">

        <header class="header">
            <h1>Drawing Drawing</h1>
        </header>

        <nav class="topControls">
            <div class="control topLeft">
                <button class="iconButton" id="rectButton">
                    <img src="Icons/Light/rectangle.png">
                </button>
                <button class="iconButton" id="circleButton">
                    <img src="Icons/Light/circle.png">
                </button>
                <button class="iconButton" id="triangleButton">
                    <img src="Icons/Light/triangle.png">
                </button>
            </div>

            <div class="control topCenter">
                <input type="color" id="colourSelect" value="#000000" class="color-picker">
                <div class="sliderGroup">
                    <div class="sliderContainer">
                        <label for="sizeSlider">SIZE</label>
                        <input type="range" id="sizeSlider" min="1" max="50" value="5" class="slider"
                            title="Brush Size">
                    </div>
                    <div class="sliderContainer">
                        <label for="opacitySlider">OPACITY</label>
                        <input type="range" id="opacitySlider" min="0" max="1" value="1" class="slider" step="0.05"
                            title="Opacity">
                    </div>
                </div>
            </div>

            <div class="control topRight">
                <button class="iconButton" id="penButton">
                    <img src="Icons/Light/pen.png">
                </button>
                <button class="iconButton" id="brushButton">
                    <img src="Icons/Light/brush.png">
                </button>
                <button class="iconButton" id="eraserButton">
                    <img src="Icons/Light/eraser.png">
                </button>
            </div>
        </nav>

        <main class="canvasArea">
            <canvas id="canvas" width="1000" height="500"></canvas>
        </main>

        <footer class="bottomControls">
            <div class="bottomLeft">
                <button class="iconButton" id="modeButton">
                    <img src="Icons/Light/mode.png">
                </button>
            </div>
            <div class="bottomCenter">
                <span id="statusText">Tip: Hold 'R' on a selected shape to rotate.<br>
                Ctrl + Z : Undo <br>
                Ctrl + Y : Redo
            </span>
            </div>

            <div class="bottomRight">
                <button class="iconButton" id="selectButton">
                    <img src="Icons/Light/select.png">
                </button>
                <button class="iconButton" id="textButton">
                    <img src="Icons/Light/textbox.png">
                </button>
                <button class="iconButton" id="imageButton">
                    <img src="Icons/Light/linkimage.png">
                </button>
            </div>
        </footer>

    </div>
    <script src="behaviour.js"></script>
</body>

</html>
